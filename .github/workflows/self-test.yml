name: self-test

# GitHub-light (owner decision 2026-10-24): pull requests only.
on:
  pull_request:

jobs:
  helpers:
    uses: ./.github/workflows/check.yml
    with:
      python-version: "3.12"
      dependency-cache: false
      setup-command: "true"
      check-command: python ops/helpers/test_taskrec.py && python ops/helpers/test_metrics.py && python -m py_compile ops/helpers/ghtask.py ops/helpers/formula.py ops/helpers/e2e_sandbox.py && python -m unittest discover -s standards/repo-baseline -p 'test_*.py'
